  <noscript><p style="text-align:center">This page needs JavaScript to find the portal.</p></noscript>
  <script>
  (() => {
    // The portal runs on a server inside the hospital; its public address changes when that server restarts.
    // The server announces each new address as a SIGNED message on this topic. Only messages that verify
    // against the public key below are trusted, so a forged message cannot send anyone elsewhere.
    const TOPIC = 'sgh-portal-c1e7c542b8f1117e31e0';
    const PUBKEY = { kty: 'EC', crv: 'P-256', x: 'd-qwqZ8uu5nZQjZCkEXMVdQjV9DluxuJLX_rBKgYpe0', y: 'dr4DY-QHKQcMa9JJ-dzcIz9MB1asPoQz5WUN5xiJBNs' };
    const MAX_AGE = 30 * 3600; // seconds: the server repeats the address every few hours
    const $ = (id) => document.getElementById(id);
    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    // Deep links: hc-cmd/?to=personnel opens that workspace (after sign-in if needed). Only these names are accepted.
    const ROUTES = { hub: '/', incentives: '/incentives.html', workforce: '/workforce/', personnel: '/personnel.html', talent: '/talent.html', academy: '/academy.html', monthly: '/monthly.html', radar: '/radar.html', retention: '/exits.html', account: '/account.html', admin: '/admin.html' };
    const qs = new URLSearchParams(location.search);
    // hc-cmd/?s=<token> is a share link made by an administrator: the portal opens the one page it was made for. Only a plain token is accepted.
    const shared = /^[A-Za-z0-9_-]{20,64}$/.test(qs.get('s') || '') ? `/s/${qs.get('s')}` : '';
    const wanted = shared;   // this page only opens a share link
    let tries = 0; let key = null;
    // no usable token in the address (a cut-off link): say so instead of opening anything
    if (!shared) { $('m').classList.add('off'); $('msg').textContent = 'This link is incomplete. Please open the full link that was sent to you.'; $('retry').style.display = 'none'; document.querySelector('.spin').style.display = 'none'; return; }

    async function latest() {
      key = key || await crypto.subtle.importKey('jwk', PUBKEY, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      const r = await fetch(`https://ntfy.sh/${TOPIC}/json?poll=1&since=36h`, { cache: 'no-store' });
      const text = await r.text();
      const found = [];
      for (const line of text.split('\n')) {
        if (!line.trim()) continue;
        let m; try { m = JSON.parse(JSON.parse(line).message); } catch { continue; }
        if (!m || typeof m.url !== 'string' || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(m.url)) continue;
        if (!Number.isFinite(m.ts) || Date.now() / 1000 - m.ts > MAX_AGE || m.ts > Date.now() / 1000 + 600) continue;
        let ok = false;
        try { ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, b64(m.sig), new TextEncoder().encode(`${m.url}|${m.ts}`)); } catch { ok = false; }
        if (ok) found.push(m);
      }
      // newest first, each address once: a tunnel that has just been replaced is tried after the new one
      found.sort((a, b) => b.ts - a.ts);
      return found.filter((m, i) => found.findIndex((x) => x.url === m.url) === i).slice(0, 4);
    }
    async function alive(url) {
      const c = new AbortController(); const t = setTimeout(() => c.abort(), 12000);
      try { const r = await fetch(`${url}/ping`, { cache: 'no-store', signal: c.signal }); return r.ok && (await r.text()) === 'ok'; } catch { return false; } finally { clearTimeout(t); }
    }
    async function go() {
      $('m').classList.remove('off'); $('msg').textContent = 'Opening your private link…';
      try {
        for (const m of await latest()) {
          // a fresh tunnel can need a few seconds before its first answer: ask twice
          if (await alive(m.url) || await alive(m.url)) { $('msg').textContent = 'Opening…'; location.replace(m.url + wanted); return; }
        }
      } catch { /* fall through to retry */ }
      if (++tries < 8) { $('msg').textContent = 'Opening your private link…'; setTimeout(go, 5000); return; }
      // keep looking quietly: the portal usually comes back within a minute or two of an update
      $('m').classList.add('off'); $('msg').textContent = 'The page is temporarily unavailable. This page keeps trying and opens it by itself.'; tries = 4;
      clearTimeout(window.__again); window.__again = setTimeout(go, 15000);
    }
    $('retry').addEventListener('click', go);
    go();
  })();
  </script>
